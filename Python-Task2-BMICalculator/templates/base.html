<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BMI Insight{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path
                        d="M24 6c9.94 0 18 8.06 18 18S33.94 42 24 42 6 33.94 6 24 14.06 6 24 6Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                    />
                    <path
                        d="M13 24h5.2l2.4-5.7 4.2 12.2 2.9-6.5H35"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>

            <div>
                <div class="brand-name">BMI Insight</div>
                <div class="brand-subtitle">Health Intelligence</div>
            </div>

        </div>

        <nav class="sidebar-nav">

            <a
                class="sidebar-link {% if active_page == 'dashboard' %}active{% endif %}"
                href="{{ url_for('dashboard') }}"
            >
                <span class="sidebar-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 10.5 12 4l8 6.5v8.2a1.3 1.3 0 0 1-1.3 1.3H5.3A1.3 1.3 0 0 1 4 18.7v-8.2Z"/>
                        <path d="M9.2 20v-5.3h5.6V20"/>
                    </svg>
                </span>
                <span>Dashboard</span>
            </a>

            <a
                class="sidebar-link {% if active_page == 'history' %}active{% endif %}"
                href="{{ url_for('history_page') }}"
            >
                <span class="sidebar-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8.2"/>
                        <path d="M12 7.7v4.8l3.2 2"/>
                    </svg>
                </span>
                <span>History</span>
            </a>

            <a
                class="sidebar-link {% if active_page == 'analytics' %}active{% endif %}"
                href="{{ url_for('analytics_page') }}"
            >
                <span class="sidebar-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 19V9"/>
                        <path d="M12 19V5"/>
                        <path d="M19 19v-7"/>
                        <path d="M4 19h16"/>
                    </svg>
                </span>
                <span>Analytics</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="database-badge">

                <span class="db-icon">
                    <svg viewBox="0 0 24 24">
                        <ellipse cx="12" cy="5.8" rx="6.8" ry="3"/>
                        <path d="M5.2 5.8v5.2c0 1.7 3 3 6.8 3s6.8-1.3 6.8-3V5.8"/>
                        <path d="M5.2 11v5.2c0 1.7 3 3 6.8 3s6.8-1.3 6.8-3V11"/>
                    </svg>
                </span>

                <div>
                    <div class="db-title">SQLite Database</div>

                    <div class="db-status">
                        <span class="db-dot"></span>
                        Connected
                    </div>
                </div>

            </div>

            <div class="sidebar-disclaimer">

                <span class="info-circle">i</span>

                <p>
                    BMI is a general screening measure and does not replace
                    professional medical advice.
                </p>

            </div>

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</div>


<div id="toast-container"></div>


<script id="bmi-users-data" type="application/json">
    {{ users | tojson }}
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

{% block scripts %}{% endblock %}

</body>
</html>
